version: "3.8"

services:
  omnilens:
    build: .
    container_name: omnilens
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite+aiosqlite:///./data/omnilens.db
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - RATE_LIMIT_PER_MINUTE=60
    volumes:
      - ./data:/app/data
      - ./token.json:/app/token.json:ro
      - ./client_secrets.json:/app/client_secrets.json:ro
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
